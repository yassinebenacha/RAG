<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG — Document Q&A</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    header {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 24px;
    }
    header h1    { font-size: 17px; font-weight: 600; color: #0f172a; }
    header .sub  { font-size: 12px; color: #94a3b8; margin-top: 3px; }

    /* ── Layout ─────────────────────────────────────────────────────────────── */
    main {
      max-width: 760px;
      margin: 32px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Card ───────────────────────────────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 22px 24px;
    }
    .card-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    /* ── Upload zone ─────────────────────────────────────────────────────────── */
    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 6px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .upload-zone:hover        { border-color: #2563eb; background: #eff6ff; }
    .upload-zone .uz-icon     { font-size: 26px; margin-bottom: 6px; }
    .upload-zone .uz-label    { font-size: 14px; color: #475569; }
    .upload-zone .uz-hint     { font-size: 12px; color: #94a3b8; margin-top: 4px; }

    /* ── Buttons ─────────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      width: 100%;
      margin-top: 12px;
    }
    .btn-primary                      { background: #2563eb; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn:disabled                     { opacity: 0.4; cursor: not-allowed; }

    /* ── Status bar ──────────────────────────────────────────────────────────── */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 6px;
      margin-top: 12px;
    }
    .status.info    { background: #eff6ff; color: #1d4ed8; }
    .status.success { background: #f0fdf4; color: #15803d; }
    .status.error   { background: #fef2f2; color: #b91c1c; }
    .status.loading { background: #f8fafc; color: #475569; }
    .status.hidden  { display: none !important; }

    /* ── Spinner ─────────────────────────────────────────────────────────────── */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Indexed badge ───────────────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    /* ── Textarea ────────────────────────────────────────────────────────────── */
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 76px;
      color: #1e293b;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea:focus        { border-color: #2563eb; }
    textarea::placeholder { color: #94a3b8; }

    /* ── Answer ──────────────────────────────────────────────────────────────── */
    .answer-text {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      color: #1e293b;
    }

    /* ── Sources ─────────────────────────────────────────────────────────────── */
    hr.divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 18px 0;
    }
    .sources-list   { display: flex; flex-direction: column; gap: 8px; }
    .source-item    { border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px 14px; }
    .source-meta    { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px;
                      font-weight: 600; color: #2563eb; margin-bottom: 6px; }
    .source-excerpt { font-size: 13px; color: #475569; line-height: 1.55; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1>RAG — Document Q&amp;A</h1>
  <div class="sub">Technical Challenge &middot; AI Engineer &middot; CIRES Technologies</div>
</header>

<main>

  <!-- ── Step 1: Upload PDF ─────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-label">Step 1 — Upload PDF</div>

    <!--
      The file input is kept outside the clickable zone to prevent browser
      rendering artifacts (native file-picker buttons appearing inside the zone).
    -->
    <input type="file" id="pdfFile" accept="application/pdf" style="display:none">

    <div class="upload-zone" id="dropZone" onclick="pdfInput.click()">
      <div class="uz-icon">📄</div>
      <div class="uz-label">Click to select a PDF file</div>
      <div class="uz-hint">PDF only</div>
    </div>

    <div id="fileSelected" class="status info hidden">
      <span>📎</span></span>
      <span id="fileNameLabel">—</span>
    </div>

    <button class="btn btn-primary" id="uploadBtn" disabled onclick="uploadPdf()">
      Index document
    </button>

    <div id="uploadStatus" class="status hidden"></div>
  </div>

  <!-- ── Step 2: Ask a question ─────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-label">Step 2 — Ask a Question</div>

    <div id="noDocMsg" class="status info">
      <span>ℹ️</span>
      <span>Index a PDF in Step 1 before asking questions.</span>
    </div>

    <div id="askPanel" class="hidden">

      <div class="badge">
        <span>✓</span>
        <span id="indexedName">document.pdf</span>
      </div>

      <textarea
        id="queryInput"
        placeholder="Ask a question about the document…"
        rows="3"
      ></textarea>

      <button class="btn btn-primary" id="askBtn" onclick="askQuestion()">
        Get answer
      </button>

      <div id="askStatus" class="status hidden"></div>
    </div>
  </div>

  <!-- ── Answer + Sources ───────────────────────────────────────────────────── -->
  <div class="card hidden" id="answerCard">
    <div class="card-label">Answer</div>
    <div class="answer-text" id="answerText"></div>

    <hr class="divider">

    <div class="card-label">Sources</div>
    <div class="sources-list" id="sourcesList"></div>
  </div>

</main>

<script>
  // ── State ────────────────────────────────────────────────────────────────────
  let documentIndexed = false;

  // ── DOM references ───────────────────────────────────────────────────────────
  const pdfInput      = document.getElementById("pdfFile");
  const uploadBtn     = document.getElementById("uploadBtn");
  const fileSelected  = document.getElementById("fileSelected");
  const fileNameLabel = document.getElementById("fileNameLabel");

  // ── File selection ───────────────────────────────────────────────────────────
  pdfInput.addEventListener("change", () => {
    const file = pdfInput.files[0];
    if (!file) return;

    // Show filename + human-readable size
    const size = file.size < 1024 * 1024
      ? (file.size / 1024).toFixed(1) + " KB"
      : (file.size / (1024 * 1024)).toFixed(1) + " MB";

    fileNameLabel.textContent = `${file.name}  ·  ${size}`;
    fileSelected.classList.remove("hidden");
    uploadBtn.disabled = false;
  });

  // ── Upload & Index ───────────────────────────────────────────────────────────
  async function uploadPdf() {
    const file = pdfInput.files[0];
    if (!file) return;

    const statusEl = document.getElementById("uploadStatus");
    uploadBtn.disabled = true;
    setStatus(statusEl, "loading", "Extracting text and building index…");

    const form = new FormData();
    form.append("file", file);

    try {
      const res  = await fetch("/pdf", { method: "POST", body: form });
      const data = await res.json();

      if (!res.ok) {
        setStatus(statusEl, "error", data.error || "Upload failed.");
        uploadBtn.disabled = false;
        return;
      }

      setStatus(statusEl, "success",
        `✓ Document indexed — ${data.pages} page(s) · ${data.chunks} chunks`);

      // Unlock Step 2
      documentIndexed = true;
      document.getElementById("noDocMsg").classList.add("hidden");
      document.getElementById("askPanel").classList.remove("hidden");
      document.getElementById("indexedName").textContent = data.filename;

    } catch (err) {
      setStatus(statusEl, "error", "Could not reach the server: " + err.message);
      uploadBtn.disabled = false;
    }
  }

  // ── Ask ──────────────────────────────────────────────────────────────────────
  async function askQuestion() {
    const query = document.getElementById("queryInput").value.trim();
    if (!query) return;

    const askBtn     = document.getElementById("askBtn");
    const askStatus  = document.getElementById("askStatus");
    const answerCard = document.getElementById("answerCard");

    askBtn.disabled = true;
    answerCard.classList.add("hidden");
    setStatus(askStatus, "loading", "Retrieving context and generating answer…");

    try {
      const res  = await fetch("/ask", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ query }),
      });
      const data = await res.json();

      if (!res.ok) {
        // Covers HTTP 400 (no index), 503 (Ollama down), 500 (vector store error)
        setStatus(askStatus, "error", data.error || "Request failed.");
        askBtn.disabled = false;
        return;
      }

      askStatus.classList.add("hidden");

      // ── Render answer ──────────────────────────────────────────────────────
      document.getElementById("answerText").textContent = data.answer;

      // ── Render sources ─────────────────────────────────────────────────────
      const list = document.getElementById("sourcesList");
      list.innerHTML = "";

      if (data.sources && data.sources.length > 0) {
        data.sources.forEach(s => {
          const el = document.createElement("div");
          el.className = "source-item";
          el.innerHTML =
            `<div class="source-meta">` +
              `<span>📄 ${esc(s.source)}</span>` +
              (s.page !== null ? `<span>Page ${s.page}</span>` : "") +
            `</div>` +
            `<div class="source-excerpt">${esc(s.excerpt)}</div>`;
          list.appendChild(el);
        });
      } else {
        list.innerHTML =
          '<p style="font-size:13px;color:#94a3b8">No matching chunks retrieved.</p>';
      }

      answerCard.classList.remove("hidden");

    } catch (err) {
      setStatus(askStatus, "error", "Could not reach the server: " + err.message);
    }

    askBtn.disabled = false;
  }

  // ── Enter key shortcut ───────────────────────────────────────────────────────
  document.getElementById("queryInput").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && documentIndexed) {
      e.preventDefault();
      askQuestion();
    }
  });

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function setStatus(el, type, text) {
    el.className = "status " + type;
    el.innerHTML = type === "loading"
      ? `<div class="spinner"></div><span>${text}</span>`
      : text;
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
</script>

</body>
</html>
